# xThrive: web app.
#
#   docker compose up -d --build         # start the web app (port 3001)
#
# Browser-side settings are compiled into the web app, so set them in a root .env file
# (copy .env.example) or your shell before building:
#   NEXT_PUBLIC_RELIVE_URL=https://relive.co.in   (where the "Log in" buttons go)
# Point the Thrive domain (through your https proxy) at port 3001.

services:
  web:
    build:
      context: .
      target: frontend
      args:
        NEXT_PUBLIC_RELIVE_URL: ${NEXT_PUBLIC_RELIVE_URL:-https://relive.co.in}
    image: thrive-web
    ports:
      - "3001:80"
    restart: unless-stopped
